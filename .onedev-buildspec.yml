version: 43
jobs:
- name: Repo Sync Push
  steps:
  - type: PushRepository
    name: Github push sync
    remoteUrl: https://github.com/VnUgE/VNLib.Core.git
    userName: VnUgE
    passwordSecret: git-access-token
    force: true
    condition: ALWAYS
    optional: false
  - type: PushRepository
    name: Codeberg push sync
    remoteUrl: https://codeberg.org/VnUgE/VNLib.Core.git
    userName: VnUgE
    passwordSecret: codeberg-access-token
    force: true
    condition: ALWAYS
    optional: false
  triggers:
  - type: TagCreateTrigger
  - type: BranchUpdateTrigger
    userMatch: anyone
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600

- name: Windows Tests
  jobExecutor: windows
  steps:
  - type: CommandStep
    name: Clone init and test
    runInContainer: false
    interpreter: !DefaultInterpreter
      commands: |
         git clone @server_url@/@project_path@ --branch @branch@ @project_name@
         cd @project_name@  
         task -t Module.Taskfile.yaml dev-init
         task -t Module.Taskfile.yaml test
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: '** -master'
    userMatch: anyone
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600

- name: Staging build
  jobExecutor: windows
  steps:
  - type: CommandStep
    name: Clone and build
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        git clone @server_url@/@project_path@ --branch @branch@ @project_name@
        vnbuild build --no-delay --verbose
        vnbuild publish --verbose
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: develop
    userMatch: anyone
  jobDependencies:
  - jobName: Windows Tests
    requireSuccessful: true
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
- name: Ubuntu Tests
  jobExecutor: docker
  steps:
  - type: CheckoutStep
    name: checkout source
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    checkoutPath: '@project_name@'
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: ubuntu-x64 tests
    runInContainer: true
    image: mcr.microsoft.com/dotnet/sdk:8.0.420-noble-amd64@@sha256:1aea676f769ae62f5588873f4ad9ab7d5ed04d859b6a7614599ccb54f5a8f89a
    interpreter:
      type: DefaultInterpreter
      commands: |
        cd @project_name@

        export DOTNET_ROOT=$(pwd)/.dotnet
        export PATH="$PATH:${DOTNET_ROOT}:$HOME/.dotnet/tools"
        export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
        bash ci/scripts/linux-setup-amd64.sh install

        task -t Module.Taskfile.yaml dev-init
        task -t Module.Taskfile.yaml test
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: '** -master'
    userMatch: anyone
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600

- name: Fedora Tests
  jobExecutor: docker
  steps:
  - type: CheckoutStep
    name: checkout source
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    checkoutPath: '@project_name@'
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: fedora-x64 tests
    runInContainer: true
    image: docker.io/fedora:43@@sha256:781b7642e8bf256e9cf75d2aa58d86f5cc695fd2df113517614e181a5eee9138
    interpreter:
      type: DefaultInterpreter
      commands: |
        cd @project_name@

        export DOTNET_ROOT=$(pwd)/.dotnet
        export PATH="$PATH:${DOTNET_ROOT}:$HOME/.dotnet/tools"
        export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
        bash ci/scripts/linux-setup-amd64.sh install

        task -t Module.Taskfile.yaml dev-init
        task -t Module.Taskfile.yaml test
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: '** -master'
    userMatch: anyone
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600

- name: Publish master
  jobExecutor: publish-agents
  steps:
  - type: CommandStep
    name: clone
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        git clone @server_url@/@project_path@ --branch @branch@ @project_name@
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Create git tag
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        cd @project_name@
        task tag-current-commit -t Module.Taskfile.yaml
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: VNBuild Build
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: "vnbuild build --no-delay"
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: VNBuild Publish
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        vnbuild publish --ftp "@secret:ftp_server_address@" --sign
    envVars:
    - name: FTP_USERNAME
      value: '@secret:ftp_username@'
    - name: FTP_PASSWORD
      value: '@secret:ftp_password@'
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: master
    userMatch: anyone
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400

- name: Code Reviews
  steps:
  - type: CommandStep
    name: clone
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        git clone @server_url@/@project_path@ --branch @branch@ @project_name@
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: run basic review
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        cd @project_name@
        task -t ./ci/Agents.Taskfile.yaml pr-basic-review
    envVars:
    - name: REVIEW_OUTPUT
      value: basic-review.md
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: publish review artifact
    artifacts: '@project_name@/basic-review.md'
    condition: SUCCESSFUL
    optional: false
  jobExecutor: windows
  triggers:
  - type: BranchUpdateTrigger
    branches: -develop -master
    userMatch: anyone
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
