version: 43
jobs:
- name: Repo Sync Push
  steps:
  - type: PushRepository
    name: Github push sync
    remoteUrl: https://github.com/VnUgE/VNLib.Core.git
    userName: VnUgE
    passwordSecret: git-access-token
    force: true
    condition: ALWAYS
    optional: false
  - type: PushRepository
    name: Codeberg push sync
    remoteUrl: https://codeberg.org/VnUgE/VNLib.Core.git
    userName: VnUgE
    passwordSecret: codeberg-access-token
    force: true
    condition: ALWAYS
    optional: false
  triggers:
  - type: TagCreateTrigger
  - type: BranchUpdateTrigger
    userMatch: anyone
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600

- name: Windows Tests
  jobExecutor: windows
  steps:
  - type: CommandStep
    name: Clone init and test
    runInContainer: false
    interpreter: !DefaultInterpreter
      commands: |
         git clone @server_url@/@project_path@ --branch @branch@ @project_name@
         cd @project_name@/ci

         mise trust mise.toml
         mise install
         mise test
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: '** -master'
    userMatch: anyone
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600

- name: Staging build
  jobExecutor: windows
  steps:
  - type: CommandStep
    name: Clone and build
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        git clone @server_url@/@project_path@ --branch @branch@ @project_name@
        cd @project_name@/ci

        mise trust mise.toml
        mise install
        mise vnbuild-build
        mise vnbuild-publish
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: develop
    userMatch: anyone
  jobDependencies:
  - jobName: Windows Tests
    requireSuccessful: true
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600

- name: Ubuntu Tests
  jobExecutor: docker
  steps:
  - type: CheckoutStep
    name: checkout source
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    checkoutPath: '@project_name@'
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: ubuntu-x64 tests
    runInContainer: true
    image: docker.io/ubuntu:24.04@@sha256:786a8b558f7be160c6c8c4a54f9a57274f3b4fb1491cf65146521ae77ff1dc54
    interpreter:
      type: DefaultInterpreter
      commands: |
        cd @project_name@/ci
        
        apt update; apt install curl -y
        chmod +x ./mise
        ./mise settings experimental=true
        ./mise bootstrap --yes
        ./mise test
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: '** -master'
    userMatch: anyone
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600

- name: Fedora Tests
  jobExecutor: docker
  steps:
  - type: CheckoutStep
    name: checkout source
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    checkoutPath: '@project_name@'
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: fedora-x64 tests
    runInContainer: true
    image: docker.io/fedora:44@@sha256:6c75d5bf57cb0fa5aa4b92c6a83c86c791644496d9ac230de7711f5b8ec3b898
    interpreter:
      type: DefaultInterpreter
      commands: |
        cd @project_name@/ci

        chmod +x ./mise
        ./mise settings experimental=true
        ./mise bootstrap --yes
        ./mise test
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: '** -master'
    userMatch: anyone
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600

- name: Publish master
  jobExecutor: publish-agents
  steps:
  - type: CommandStep
    name: clone
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        git clone @server_url@/@project_path@ --branch @branch@ @project_name@
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Create git tag
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        cd @project_name@
        task tag-current-commit -t Module.Taskfile.yaml
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: VNBuild Build
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: "vnbuild build --no-delay"
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: VNBuild Publish
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        vnbuild publish --ftp "@secret:ftp_server_address@" --sign
    envVars:
    - name: FTP_USERNAME
      value: '@secret:ftp_username@'
    - name: FTP_PASSWORD
      value: '@secret:ftp_password@'
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: master
    userMatch: anyone
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400

- name: Code Reviews
  steps:
  - type: CommandStep
    name: clone
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        git clone @server_url@/@project_path@ --branch @branch@ @project_name@
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: run basic review
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        cd @project_name@
        task -t ./ci/Agents.Taskfile.yaml pr-basic-review
    envVars:
    - name: REVIEW_OUTPUT
      value: basic-review.md
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: publish review artifact
    artifacts: '@project_name@/basic-review.md'
    condition: SUCCESSFUL
    optional: false
  jobExecutor: windows
  triggers:
  - type: BranchUpdateTrigger
    branches: -develop -master
    userMatch: anyone
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
