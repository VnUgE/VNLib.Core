min_version = "2024.9.5"

[tools]
dotnet = "8.0"
task = "3.53"
node = "26"
process-compose = "1.122"
"npm:@usebruno/cli" = "4.2.0"

[env]
DOTNET_SYSTEM_GLOBALIZATION_INVARIANT = "1"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"

[tasks.run-ci-tests]
dir = '.'
run = [
	'task setup-server',
	'process-compose run tests --no-server'
]


