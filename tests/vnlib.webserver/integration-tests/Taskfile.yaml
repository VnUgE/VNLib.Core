# This taskfile stages a local web server with the integration test plugin
# and runs the bruno collection against it. It is intentionally standalone:
# no mise tasks or CI jobs reference it yet (a dedicated mise config comes later).
#
# Assumed steps (run `task dev-init -t ../../Module.Taskfile.yaml` first for native deps):
# task setup-server (in this directory)
# process-compose run tests

version: '3.45'

dotenv: ['.env']

vars:
  WORKSPACE_DIR: '{{ .USER_WORKING_DIR }}/workspace'
  SERVER_DIR: '{{ .WORKSPACE_DIR }}/vnlib.webserver'
  PLUGINS_DIR: '{{ .WORKSPACE_DIR }}/plugins'

tasks:

  build-server:
    desc: Builds the web server in debug mode
    dir: '../../../apps/VNLib.WebServer'
    cmds:
      - cmd: task 'CONFIGURATION=debug' -- --output "{{ .SERVER_DIR }}"

  build-plugin:
    desc: Builds the integration test plugin in debug mode
    dir: test-plugin-src/
    cmds:
      - cmd: dotnet build --configuration debug --output '{{ .PLUGINS_DIR }}/TestPlugin'

  setup-server:
    desc: Stages the server and test plugin into the server workspace
    deps:
      - task: build-server
      - task: build-plugin
    cmds:
      - cmd: mkdir -p "{{ .WORKSPACE_DIR }}/wwwroot"
        ignore_error: true

  run-tests:
    desc: Runs the bruno collection against the staged server (requires bru on PATH)
    requires:
      vars: [ TEST_SERVER_URL ]
    # bru must run at the collection root (where bruno.json lives)
    dir: 'bruno'
    cmds:
      - cmd: bru run --env local --env-var baseUrl={{ .TEST_SERVER_URL }}

  clean:
    desc: Removes the staged server directory and build outputs
    requires:
      vars: [ SERVER_BUILD_DIR ]
    cmds:
      - cmd: rm -rf "{{ .SERVER_BUILD_DIR }}"
        ignore_error: true
